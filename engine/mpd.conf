# MPD de LAFLEURMUSIC sur l'Anbernic RG SP (ROCKNIX, PipeWire).
# État sur la carte système (ext4) : l'exFAT de la carte de 128 Go abîmait les petits fichiers réécrits.
music_directory     "/storage/roms/music"
playlist_directory  "/storage/.config/lafleur-music/state/playlists"
db_file             "/storage/.config/lafleur-music/state/database"
state_file          "/storage/.config/lafleur-music/state/state"
pid_file            "/storage/.config/lafleur-music/state/pid"
log_file            "/storage/.config/lafleur-music/state/mpd.log"

bind_to_address     "127.0.0.1"
port                "6601"

auto_update         "yes"
restore_paused      "yes"
filesystem_charset  "UTF-8"

# Repris tel quel de mpd/configs/pipewire/mpdconf (port PortMaster « Music Player Daemon »).
audio_output {
        type            "pipewire"
        name            "PipeWire Sound Server"
}
