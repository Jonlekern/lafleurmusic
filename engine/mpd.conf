# MPD de LAFLEUR Music sur l'Anbernic RG SP (ROCKNIX, PipeWire).
music_directory     "/storage/roms/music"
playlist_directory  "/storage/roms/lafleur-music/engine/state/playlists"
db_file             "/storage/roms/lafleur-music/engine/state/database"
state_file          "/storage/roms/lafleur-music/engine/state/state"
pid_file            "/storage/roms/lafleur-music/engine/state/pid"
log_file            "/storage/roms/lafleur-music/engine/state/mpd.log"

bind_to_address     "127.0.0.1"
port                "6601"

auto_update         "yes"
restore_paused      "yes"
filesystem_charset  "UTF-8"

# Repris tel quel de mpd/configs/pipewire/mpdconf (port PortMaster « Music Player Daemon »).
audio_output {
        type            "pipewire"
        name            "PipeWire Sound Server"
}
